version: "3.9"

services:
  perso-web:
    container_name: web
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - TRACKING_DIR=/app/tracking-data
      - ADMIN_KEY=${ADMIN_KEY}          # set in .env next to this file; unlocks /admin/links
    volumes:
      - ./tracking-data:/app/tracking-data   # CV link registry + open log survive rebuilds
    expose:
      - "3000"           # only inside Docker, nginx will reach it via proxy_net
    restart: unless-stopped
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true       # uses the shared network you created
